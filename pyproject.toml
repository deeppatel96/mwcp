[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mwcp"
version = "0.2.0"
description = "Run several Maximum Weight Clique solvers (WLMC, FastWClq, OpenPLS) on a METIS graph"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = ["cmake>=3.20", "pytest>=7"]

[project.scripts]
mwcp = "mwcp.cli:main"

[tool.setuptools.packages.find]
include = ["mwcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
